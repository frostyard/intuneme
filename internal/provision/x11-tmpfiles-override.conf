# Installed by intuneme as /etc/tmpfiles.d/x11.conf. A file in /etc/tmpfiles.d
# replaces the same-named file in /usr/lib/tmpfiles.d, so this is a copy of the
# base image's x11-common file with one line dropped:
#
#     D! /tmp/.X11-unix 1777 root root 10d
#
# intuneme bind-mounts the host's /tmp/.X11-unix directly into the container,
# so that directory is the host's own and not a copy. Type D empties a
# directory when systemd-tmpfiles runs with --remove, which the container's
# systemd-tmpfiles-setup.service does on every boot. Booting the container
# would therefore delete the host's Xwayland socket, and no new X11 client
# could connect anywhere on the host until the display server restarted.
#
# The container does not need that line. The directory it describes arrives
# from the host already created. Every other directive of the vendor file is
# reproduced below and stays in force.

D! /tmp/.ICE-unix 1777 root root 10d
D! /tmp/.XIM-unix 1777 root root 10d
D! /tmp/.font-unix 1777 root root 10d

# Unlink the X11 lock files
r! /tmp/.X[0-9]*-lock
