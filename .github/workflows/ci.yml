# CI workflow. The jobs together run every prerequisite of `make ci`
# (core ADR-0073): each prerequisite runs as its own `make <target>` step, so a
# new prerequisite of `ci` needs a job step in the same change. The name stays
# `Tests` because snapshot.yml triggers on it. Actions use full commit SHA
# pins, the token has no permissions by default, and checkout does not persist
# credentials (core ADR-0021).
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "ubuntu-intune/**"
  pull_request:
    branches: [main, "security/**"]
    paths-ignore:
      - "ubuntu-intune/**"

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # golangci-lint and Node come from mise.toml and mise.lock, checksum
      # verified, exactly as a developer's `mise install` does.
      - name: Install the pinned tools
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          install_args: golangci-lint node
          cache: true

      - name: Prepare namespace regression tests
        run: |
          sudo apt-get update
          sudo apt-get install -y uidmap
          if ! grep -q "^${USER}:" /etc/subuid; then
            sudo usermod --add-subuids 200000-265535 --add-subgids 200000-265535 "$USER"
          fi
          # The runner is ephemeral; allow its unshare test executable.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Download dependencies
        run: go mod download

      - name: Run make verify
        run: make verify
        env:
          INTUNEME_REQUIRE_KERNEL_TESTS: "1"

      # A push event has no pull request, so BASE is empty and the check is
      # skipped there.
      - name: Check corrections against the base
        run: make corrections-base BASE=${{ github.event.pull_request.base.sha }}

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The govulncheck release is pinned in the Makefile (`make vulncheck`),
      # and the Go checksum database verifies the module.
      - name: Run make vulncheck
        run: make vulncheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run make build
        run: make build
