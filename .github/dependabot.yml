version: 2
updates:
  # Maintain Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Stay on buildah-build v2 (#233): v3 defaults `squash` to true, which
      # flattens the ubuntu-intune image to 1 layer and loses layer reuse.
      - dependency-name: "redhat-actions/buildah-build"
        update-types: ["version-update:semver-major"]

  # Maintain the container base images
  - package-ecosystem: "docker"
    directory: "/ubuntu-intune"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Stay on Ubuntu 24.04 LTS: Microsoft supports the Intune agent and the
      # identity broker only on LTS releases, and not yet on Ubuntu 26.04.
      # Dependabot reads an interim release (24.10, 25.04) as a minor or major
      # version, so ignore both; digest updates of 24.04 continue. A move to a
      # new LTS needs its own change (the Microsoft repository key, package
      # checks and an enrollment test), not a Dependabot bump. Remove this when
      # Intune supports the next LTS. dependabot_config_test.go pins it.
      - dependency-name: "library/ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
