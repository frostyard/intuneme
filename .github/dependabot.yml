version: 2
updates:
  # Maintain Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Stay on buildah-build v2 (#233): v3 defaults `squash` to true, which
      # flattens the ubuntu-intune image to 1 layer and loses layer reuse.
      - dependency-name: "redhat-actions/buildah-build"
        update-types: ["version-update:semver-major"]

  # Maintain the container base images
  - package-ecosystem: "docker"
    directory: "/ubuntu-intune"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Stay on Ubuntu 24.04 LTS: Microsoft does not support the Intune agent
      # and the identity broker on Ubuntu 26.04 yet. A new major needs its own
      # change (the Microsoft repository key, package checks and an enrollment
      # test), not a digest bump. Remove this when Intune supports the release.
      - dependency-name: "library/ubuntu"
        update-types: ["version-update:semver-major"]
