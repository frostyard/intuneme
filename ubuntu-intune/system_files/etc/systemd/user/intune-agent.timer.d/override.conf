[Unit]
PartOf=default.target
After=default.target
# Run only after a session setup has pushed the environment (DISPLAY, XAUTHORITY,
# Wayland/WebKit vars) into the D-Bus activation environment. With linger the
# user manager starts at container boot, so without this gate the timer could
# fire first; the agent would activate the identity broker with no DISPLAY and
# the broker would die. At boot the condition fails and the timer is skipped.
# intuneme-session-setup touches this file once the activation environment is
# set, and its last lines then start the timer. %t is $XDG_RUNTIME_DIR for a
# user unit.
ConditionPathExists=%t/intuneme-session-env

[Install]
WantedBy=default.target
